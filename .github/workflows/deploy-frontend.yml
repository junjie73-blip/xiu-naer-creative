name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Pages
        uses: actions/configure-pages@v5
        id: pages
        with:
          enablement: true

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: '**/package-lock.json'

      - name: 安装根目录依赖
        run: npm ci

      - name: 生成 Prisma 客户端
        run: npm run db:generate

      - name: 构建 H5 前端
        env:
          VITE_API_BASE_URL: ${{ vars.API_BASE_URL }}
          REPO_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build

      - name: 安装 Admin 依赖
        working-directory: ./admin
        run: npm ci

      - name: 构建 Admin 后台
        working-directory: ./admin
        env:
          VITE_API_BASE_URL: ${{ vars.API_BASE_URL }}
          ADMIN_BASE_PATH: ${{ steps.pages.outputs.base_path }}/admin/
        run: npm run build

      - name: 合并 Admin 到部署目录
        run: cp -r admin/dist dist/admin

      - name: 上传部署产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
