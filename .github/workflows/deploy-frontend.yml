name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Pages
        uses: actions/configure-pages@v5
        id: pages
        with:
          enablement: true

      - name: 准备部署文件
        run: |
          mkdir _site
          cp index.html _site/index.html
          cp xiu-naer-creative.html _site/xiu-naer-creative.html
          cp README.md _site/README.md
          cp -r _shared _site/_shared

      - name: 上传静态文件
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
