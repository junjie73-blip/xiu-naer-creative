name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: '**/package-lock.json'

      - name: 安装根目录依赖
        run: npm ci

      - name: 生成 Prisma 客户端
        run: npm run db:generate

      - name: 代码规范检查
        run: npm run lint

      - name: TypeScript 类型检查（H5 + API）
        run: npm run check

      - name: 构建 H5 前端
        run: npm run build

      - name: 安装 Admin 依赖
        working-directory: ./admin
        run: npm ci

      - name: TypeScript 类型检查（Admin）
        working-directory: ./admin
        run: npm run check

      - name: 构建 Admin 后台
        working-directory: ./admin
        run: npm run build
